services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: climate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: climate_twin
      POSTGRES_USER: climate
      POSTGRES_PASSWORD: climate_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: